# One-click "detective cases". variable_id (and related_variable_id) must exist in variables.yaml; dates must
# be inside the variable's availability. bbox may be null only for "series" variables (single global records);
# center is where the globe flies to.

- id: punjab-groundwater
  title: Is Punjab running out of groundwater?
  question: Has the groundwater under the farmlands of Punjab and Haryana in northwest India gone down since 2003?
  bbox: {west: 73.5, south: 28.5, east: 77.5, north: 32.5}
  variable_id: gldas_gws
  start: 2003-02-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 30.5, lon: 75.5}
  related_variable_id: gpm_precipitation
  takeaway: Groundwater falls steadily while rainfall shows no significant trend, so the loss is not caused by less rain; it points to people pumping water for irrigation faster than it is refilled.

- id: punjab-rain
  title: Did the rain change in Punjab?
  question: Has rainfall over Punjab and Haryana changed since 2003, enough to explain the falling groundwater?
  bbox: {west: 73.5, south: 28.5, east: 77.5, north: 32.5}
  variable_id: gpm_precipitation
  start: 2003-02-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 30.5, lon: 75.5}
  related_variable_id: gldas_gws
  takeaway: Rainfall goes up and down from year to year but has no significant trend, so the climate did not take the groundwater away.

- id: delhi-no2
  title: Is Delhi's air getting dirtier?
  question: Has nitrogen dioxide from traffic and power plants over Delhi increased since 2005?
  bbox: {west: 76.8, south: 28.3, east: 77.6, north: 28.9}
  variable_id: omi_no2
  start: 2005-01-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 28.6, lon: 77.2}
  related_variable_id: merra2_bc
  takeaway: NO₂ over Delhi keeps rising as traffic and coal power grow, with a clear dip during the spring 2020 lockdown that shows how much of it comes from human activity.

- id: china-so2
  title: Did China clean up its coal smoke?
  question: Did sulfur dioxide from coal burning over the North China Plain drop after power plants were fitted with scrubbers around 2010?
  bbox: {west: 113, south: 34, east: 119, north: 40}
  variable_id: merra2_so2
  start: 2000-01-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 37, lon: 116}
  related_variable_id: merra2_so4
  takeaway: SO₂ climbed until about 2010 and then fell steeply, so the record as a whole is falling; a sign that cleaner coal plants and closures worked.

- id: phoenix-nights
  title: Is Phoenix heating up?
  question: Are nights in Phoenix getting hotter as the city grows into the desert?
  bbox: {west: -112.5, south: 33.2, east: -111.6, north: 33.8}
  variable_id: modis_lst_night
  start: 2000-03-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 33.45, lon: -112.07}
  related_variable_id: modis_lst_day
  takeaway: Night-time ground temperature in Phoenix rises much faster than the global average because concrete and asphalt store the day's heat; the urban heat island.

- id: mauna-loa-co2
  title: How fast is CO₂ rising?
  question: How quickly has carbon dioxide in the air increased since measurements began at Mauna Loa in 1958?
  bbox: null
  variable_id: mauna_loa_co2
  start: 1958-03-01
  end: 2024-10-31
  deseasonalize: true
  center: {lat: 19.54, lon: -155.58}
  related_variable_id: noaa_co2_marine
  takeaway: CO₂ has risen every single year, from about 315 to over 420 ppm, and the rise is speeding up as we burn more fossil fuel; the yearly wiggle is plants breathing in summer.

- id: global-methane
  title: Is methane still climbing?
  question: Is the amount of methane in the air still increasing, and has it ever stopped?
  bbox: null
  variable_id: noaa_ch4_marine
  start: 1983-07-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 0, lon: -160}
  related_variable_id: noaa_co2_marine
  takeaway: Methane rose quickly, paused around 2000–2006, and then started climbing again even faster, driven by fossil fuels, farming, landfills and wetlands.

- id: rondonia-forest
  title: Is the Amazon in Rondônia losing its forest?
  question: Has the vegetation of central Rondônia in the Brazilian Amazon become less green since 2001, as forest is cleared for cattle and crops?
  bbox: {west: -64.0, south: -11.0, east: -62.0, north: -9.0}
  variable_id: modis_ndvi
  start: 2001-01-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: -10.0, lon: -63.0}
  takeaway: A falling NDVI here means fewer trees and more pasture and fields; check whether the drop is significant and how fast it goes.

- id: sahel-green
  title: Is the Sahel turning into desert?
  question: Has the vegetation in southern Niger changed since 2001, and does rainfall explain it?
  bbox: {west: 5.0, south: 13.0, east: 8.0, north: 15.0}
  variable_id: modis_ndvi
  start: 2001-01-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 14.0, lon: 6.5}
  related_variable_id: gpm_precipitation
  takeaway: Compare greenness with rainfall over the same area; if vegetation changes while rain does not, people (grazing, farming) are the more likely cause.

- id: delhi-lights
  title: Is Delhi spreading out at night?
  question: Have the night lights over Delhi grown brighter since 2012, as the city and its suburbs expand?
  bbox: {west: 76.8, south: 28.3, east: 77.6, north: 28.9}
  variable_id: viirs_night_lights
  start: 2012-01-01
  end: 2025-12-31
  deseasonalize: true
  center: {lat: 28.6, lon: 77.2}
  related_variable_id: omi_no2
  takeaway: Brighter nights mean more buildings, roads and traffic; compare with NO₂ over the same area to see whether pollution grows with the city.
