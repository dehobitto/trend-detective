# ---------------------------------------------------------------- land: MODIS LST (AppEEARS) -------------
# MOD11C3 stores LST in Kelvin (as scaled integers; the reader applies the 0.02 scale factor first).
# We show °C: value_K - 273.15. Real access: AppEEARS area request (or MOD11A2 8-day for finer cities).

- id: modis_lst_day
  name: Daytime land surface temperature
  short_definition: How hot the ground itself gets in the late morning, seen from space by its heat glow. Pavement, roofs and deserts can be much hotter than the air above them.
  why_it_matters: Hot surfaces drive heat waves and dry out soils, and they show urban heat islands where cities replace plants with concrete.
  units: °C
  sphere: land
