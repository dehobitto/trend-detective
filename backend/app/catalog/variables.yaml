# Earth-science variables offered in the variable picker: the datasets the team actually uses
# (see "Датасети та змінні.md").
#
# Public fields mirror the `Variable` type in docs/API.md. Internal blocks are NOT sent to clients:
#   ratio_scale: false  -> percent change is meaningless (e.g. °C has an arbitrary zero), so it is null.
#   conversion:         -> native product units -> catalog units for real-data providers:
#                          catalog_value = native_value * scale + offset  (CatalogVariable.to_catalog_units)
#   synthetic:          -> hints for the synthetic demo provider (realistic ranges, seasonality, trends).
#     base + base_lat*|lat|         climatological mean at a grid point
#     amp + amp_lat*|lat|           half-range of the seasonal cycle
#     peak_month                    month of the seasonal maximum in the northern hemisphere (+6 in the south)
#     trend_per_decade              trend scale; the background trend is
#                                   trend_per_decade * (bias + spread * wave(lat, lon)) (sign can flip by region)
#     polar_amplification           extra trend multiplier ramping up poleward of 55°
#     noise, noise_lat, noise_rel   AR(1) "red" noise std-dev: + noise_lat*|lat| + noise_rel*|local mean level|
#     ar1                           lag-1 correlation of the noise
#     hotspots                      [{lat, lon, radius, base, amp, trend, break_year, trend_before, damp}]
#                                   Gaussian bumps: base/amp offsets (catalog units), a local trend factor
#                                   (x trend_per_decade) that can change at break_year (trend_before -> trend),
#                                   and damp (0..1) to switch the background trend off there.
#     dips                          [{start, end, fraction}] temporarily remove part of the hotspot excess
#                                   (e.g. the 2020 COVID lockdowns for NO₂ over cities)
#     curve                         "series" variables only: [[decimal_year, value], ...] knots (linear between)
#     min, max                      physical clamp; gap_fraction: share of missing months (satellite gaps)
#
# Map (public `map_layer`, internal `colormap`), see docs/API.md "v2 additions":
#   map_layer: {kind: gibs, ...}    real NASA GIBS imagery for the time slider, verified against GetCapabilities
#                                   and by downloading a tile. Refresh: `.venv/bin/python -m app.tools.gibs_layers`.
#                                   time_start/time_end = what GIBS has (not the product's availability).
#   map_layer: {kind: grid}         no good GIBS layer: the frontend draws /api/grid frames instead
#                                   (/api/grid works for every area variable either way).
#   map_layer: null                 "series" variables (no map).
#   colormap: <name>                colormap of /api/grid frames, defined in colormaps.yaml.
#
# Coverage "series" = a ready-made single record (one station, or a global mean): the bbox is ignored and
# `location` is set for station records. Daily products (GLDAS, OMI) are served as MONTHLY AREA MEANS: the
# provider averages the days of each month (processing.timeseries.to_monthly) and the grid cells inside the bbox.
#
# Availability end dates are conservative (last fully processed month we rely on).

# ---------------------------------------------------------------- water: GLDAS (groundwater) -------------

- id: gldas_gws
  name: Groundwater storage
  short_definition: How much water is stored underground in soil pores and rock (aquifers), shown as the depth of water in millimeters it would make if spread over the surface.
  why_it_matters: Groundwater is the water most changed by people, because wells pump it for irrigation and cities faster than rain can refill it.
  units: mm
  sphere: water
  source: GLDAS Catchment land surface model with GRACE satellite data assimilated
  mission_or_model: GLDAS
  product: "GLDAS_CLSM025_DA1_D.2.2:GWS_tavg"
  dataset: GLDAS_CLSM025_DA1_D v2.2
  access: Giovanni
  temporal_resolution: daily
  available_start: 2003-02-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2002-04-04, time_end: 2022-07-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI_H.svg}
  colormap: brown_teal
  location: null
  synthetic: {base: 600, amp: 30, peak_month: 4, trend_per_decade: 10, bias: 0.3, spread: 0.6,
              noise: 12, ar1: 0.85, min: 0, max: 5000,
              hotspots: [{lat: 30.0, lon: 75.5, radius: 3.5, trend: -18, amp: 40, damp: 1},   # NW India (Punjab/Haryana)
                         {lat: 36.5, lon: -120.0, radius: 2.5, trend: -10, damp: 1},           # California Central Valley
                         {lat: 37.5, lon: 115.5, radius: 3, trend: -9, damp: 1},               # North China Plain
                         {lat: 33.5, lon: 46.0, radius: 6, trend: -12, damp: 1}]}              # Middle East (Tigris-Euphrates, W Iran)

- id: gldas_tws
  name: Terrestrial water storage
  short_definition: All the water stored on and under the land in one place, added together; snow, soil moisture, groundwater, plants and surface water, in millimeters of water depth.
  why_it_matters: It is the land's total "water bank balance", a backup check on groundwater because it is close to what the GRACE satellites actually weigh from space.
  units: mm
  sphere: water
  source: GLDAS Catchment land surface model with GRACE satellite data assimilated
  mission_or_model: GLDAS
  product: "GLDAS_CLSM025_DA1_D.2.2:TWS_tavg"
  dataset: GLDAS_CLSM025_DA1_D v2.2
  access: Giovanni
  temporal_resolution: daily
  available_start: 2003-02-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2002-04-04, time_end: 2022-07-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI_H.svg}
  colormap: brown_teal
  location: null
  synthetic: {base: 900, amp: 60, peak_month: 4, trend_per_decade: 10, bias: 0.3, spread: 0.8,
              noise: 18, ar1: 0.8, min: 0, max: 8000,
              hotspots: [{lat: 30.0, lon: 75.5, radius: 3.5, trend: -20, amp: 60, damp: 1},
                         {lat: 36.5, lon: -120.0, radius: 2.5, trend: -12, damp: 1},
                         {lat: 37.5, lon: 115.5, radius: 3, trend: -10, damp: 1},
                         {lat: 33.5, lon: 46.0, radius: 6, trend: -14, damp: 1}]}

# ---------------------------------------------------------------- water: GPM (rain) ----------------------

- id: gpm_precipitation
  name: Precipitation
  short_definition: How much rain and snow falls, as millimeters of water per day averaged over the month, combined from a fleet of satellites.
  why_it_matters: Rainfall is the natural way groundwater is refilled, so it tells us whether a water loss is caused by the climate or by people.
  units: mm/day
  sphere: water
  source: GPM IMERG Final Run (multi-satellite)
  mission_or_model: GPM
  product: "GPM_3IMERGM.07:precipitation"
  dataset: GPM_3IMERGM v07
  access: Giovanni
  temporal_resolution: monthly
  available_start: 2000-06-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_Precipitation_Bias_Corrected_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_Precipitation_Bias_Corrected_Monthly_H.svg}
  colormap: blue_green
  location: null
  conversion: {native_units: mm/hr, scale: 24, note: "IMERG monthly is a mean rate in mm/hr; x24 gives mm/day"}
  synthetic: {base: 5.5, base_lat: -0.07, amp: 1.5, peak_month: 7, trend_per_decade: 0.08,
              bias: 0.0, spread: 1.0, noise: 0.7, ar1: 0.25, min: 0, max: 40,
              hotspots: [{lat: 30.0, lon: 75.5, radius: 3.5, base: -1.6, amp: 1.0, trend: 0, damp: 1},  # NW India: flat
                         {lat: -6, lon: -60, radius: 12, trend: -3, base: 2.0},
                         {lat: 22, lon: 10, radius: 12, trend: 0, base: -4.5}]}

# ---------------------------------------------------------------- atmosphere: OMI NO₂ --------------------

- id: omi_no2
  name: Nitrogen dioxide (NO₂)
  short_definition: The amount of nitrogen dioxide gas in the lower atmosphere above an area, seen from space. It comes mostly from car engines, power plants and factories that burn fuel at high temperature.
  why_it_matters: NO₂ harms lungs and helps make ozone smog and fine particles; it stays close to its source, which is why it drops on weekends and fell sharply during the 2020 lockdowns.
  units: "10¹⁵ molecules/cm²"
  sphere: atmosphere
  source: OMI on NASA's Aura satellite
  mission_or_model: OMI
  product: "OMNO2d.004:ColumnAmountNO2TropCloudScreened"
  dataset: OMNO2d v004
  access: Giovanni
  temporal_resolution: daily
  available_start: 2004-10-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: OMI_Nitrogen_Dioxide_Tropo_Column, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: daily, time_start: 2004-10-01, time_end: 2026-11-09,
              legend_url: https://gibs.earthdata.nasa.gov/legends/OMI_Nitrogen_Dioxide_Tropo_Column_H.svg}
  colormap: yellow_orange_brown
  location: null
  conversion: {native_units: molecules/cm², scale: 1.0e-15}
  synthetic: {base: 1.0, amp: 0.2, peak_month: 1, trend_per_decade: 1.0, bias: 0.0, spread: 0.03,
              noise: 0.1, noise_rel: 0.12, ar1: 0.3, min: 0.05, max: 60, gap_fraction: 0.02,
              hotspots: [{lat: 28.6, lon: 77.2, radius: 1.5, base: 4.5, amp: 1.5, trend: 1.3},          # Delhi
                         {lat: 23.5, lon: 83.0, radius: 6, base: 1.0, amp: 0.3, trend: 0.5},            # Indian coal belt
                         {lat: 39.9, lon: 116.4, radius: 2, base: 12, amp: 6, break_year: 2011, trend_before: 3, trend: -5.5},  # Beijing
                         {lat: 36.5, lon: 115.0, radius: 4, base: 5, amp: 3, break_year: 2011, trend_before: 2, trend: -3},     # North China Plain
                         {lat: 40.7, lon: -74.0, radius: 1.5, base: 6, amp: 1.5, break_year: 2011, trend_before: -2.5, trend: -1.5},  # New York
                         {lat: 34.05, lon: -118.25, radius: 1.2, base: 7, amp: 1.5, break_year: 2011, trend_before: -3, trend: -2},  # Los Angeles
                         {lat: 51.3, lon: 6.5, radius: 2.5, base: 5, amp: 2, break_year: 2011, trend_before: -1.5, trend: -1.5},     # Rhine-Ruhr / Benelux
                         {lat: 51.5, lon: -0.1, radius: 1.2, base: 4, amp: 1.5, break_year: 2011, trend_before: -1, trend: -1.5}],   # London
              dips: [{start: 2020-03-01, end: 2020-05-31, fraction: 0.35}]}                           # COVID-19 lockdowns

# ---------------------------------------------------------------- atmosphere: MERRA-2 aerosols -----------

- id: merra2_dust
  name: Dust near the ground
  short_definition: How much desert dust floats in the air near the surface, in micrograms per cubic meter. Wind lifts it from deserts and can carry it across oceans.
  why_it_matters: Dust storms damage health, crops and solar panels, and dust fertilizes oceans and the Amazon far from where it started.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:DUSMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_Dust_Surface_Mass_Concentration_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_Dust_Surface_Mass_Concentration_Monthly_H.svg}
  colormap: yellow_orange_brown
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}
  synthetic: {base: 2, base_lat: -0.03, amp: 0.5, peak_month: 6, trend_per_decade: 1.0, bias: 0.0, spread: 0.2,
              noise: 1, noise_rel: 0.25, ar1: 0.3, min: 0, max: 2000,
              hotspots: [{lat: 20, lon: 5, radius: 12, base: 120, amp: 60},           # Sahara
                         {lat: 17, lon: 18, radius: 4, base: 80, amp: 30},            # Bodélé depression
                         {lat: 25, lon: 47, radius: 8, base: 70, amp: 45, trend: 4},  # Arabian Peninsula / Middle East
                         {lat: 40, lon: 85, radius: 7, base: 60, amp: 40},            # Taklimakan / Gobi
                         {lat: 27, lon: 71, radius: 4, base: 40, amp: 30}]}           # Thar desert

