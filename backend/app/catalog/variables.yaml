# Earth-science variables offered in the variable picker: the datasets the team actually uses
# (see "Датасети та змінні.md").
#
# Public fields mirror the `Variable` type in docs/API.md. Internal blocks are NOT sent to clients:
#   ratio_scale: false  -> percent change is meaningless (e.g. °C has an arbitrary zero), so it is null.
#   conversion:         -> native product units -> catalog units for real-data providers:
#                          catalog_value = native_value * scale + offset  (CatalogVariable.to_catalog_units)
# Map (public `map_layer`), see docs/API.md "v2 additions":
#   map_layer: {kind: gibs, ...}    real NASA GIBS imagery for the time slider, verified against GetCapabilities
#                                   and by downloading a tile. Refresh: `.venv/bin/python -m app.tools.gibs_layers`.
#                                   time_start/time_end = what GIBS has (not the product's availability).
#   map_layer: null                 no map imagery: "series" variables, and area variables without a GIBS layer
#                                   (still analysed for any box drawn on the map).
#
# Coverage "series" = a ready-made single record (one station, or a global mean): the bbox is ignored and
# `location` is set for station records. Daily and 8-day products (GLDAS, OMI, MODIS LST) are served as MONTHLY AREA MEANS: the
# provider averages the days of each month (processing.timeseries.to_monthly) and the grid cells inside the bbox.
#
# Availability end dates are conservative (last fully processed month we rely on).

# ---------------------------------------------------------------- water: GLDAS (groundwater) -------------

- id: gldas_gws
  name: Groundwater storage
  short_definition: How much water is stored underground in soil pores and rock (aquifers), shown as the depth of water in millimeters it would make if spread over the surface.
  why_it_matters: Groundwater is the water most changed by people, because wells pump it for irrigation and cities faster than rain can refill it.
  units: mm
  sphere: water
  source: GLDAS Catchment land surface model with GRACE satellite data assimilated
  mission_or_model: GLDAS
  product: "GLDAS_CLSM025_DA1_D.2.2:GWS_tavg"
  dataset: GLDAS_CLSM025_DA1_D v2.2
  access: Giovanni
  temporal_resolution: daily
  available_start: 2003-02-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2002-04-04, time_end: 2022-07-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI_H.svg}
  location: null

- id: gldas_tws
  name: Terrestrial water storage
  short_definition: All the water stored on and under the land in one place, added together; snow, soil moisture, groundwater, plants and surface water, in millimeters of water depth.
  why_it_matters: It is the land's total "water bank balance", a backup check on groundwater because it is close to what the GRACE satellites actually weigh from space.
  units: mm
  sphere: water
  source: GLDAS Catchment land surface model with GRACE satellite data assimilated
  mission_or_model: GLDAS
  product: "GLDAS_CLSM025_DA1_D.2.2:TWS_tavg"
  dataset: GLDAS_CLSM025_DA1_D v2.2
  access: Giovanni
  temporal_resolution: daily
  available_start: 2003-02-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2002-04-04, time_end: 2022-07-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/GRACE_Tellus_Liquid_Water_Equivalent_Thickness_Mascon_CRI_H.svg}
  location: null

# ---------------------------------------------------------------- water: GPM (rain) ----------------------

- id: gpm_precipitation
  name: Precipitation
  short_definition: How much rain and snow falls, as millimeters of water per day averaged over the month, combined from a fleet of satellites.
  why_it_matters: Rainfall is the natural way groundwater is refilled, so it tells us whether a water loss is caused by the climate or by people.
  units: mm/day
  sphere: water
  source: GPM IMERG Final Run (multi-satellite)
  mission_or_model: GPM
  product: "GPM_3IMERGM.07:precipitation"
  dataset: GPM_3IMERGM v07
  access: Giovanni
  temporal_resolution: monthly
  available_start: 2000-06-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_Precipitation_Bias_Corrected_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_Precipitation_Bias_Corrected_Monthly_H.svg}
  location: null
  conversion: {native_units: mm/hr, scale: 24, note: "IMERG monthly is a mean rate in mm/hr; x24 gives mm/day"}

# ---------------------------------------------------------------- atmosphere: OMI NO₂ --------------------

- id: omi_no2
  name: Nitrogen dioxide (NO₂)
  short_definition: The amount of nitrogen dioxide gas in the lower atmosphere above an area, seen from space. It comes mostly from car engines, power plants and factories that burn fuel at high temperature.
  why_it_matters: NO₂ harms lungs and helps make ozone smog and fine particles; it stays close to its source, which is why it drops on weekends and fell sharply during the 2020 lockdowns.
  units: "10¹⁵ molecules/cm²"
  sphere: atmosphere
  source: OMI on NASA's Aura satellite
  mission_or_model: OMI
  product: "OMNO2d.004:ColumnAmountNO2TropCloudScreened"
  dataset: OMNO2d v004
  access: Giovanni
  temporal_resolution: daily
  available_start: 2004-10-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: OMI_Nitrogen_Dioxide_Tropo_Column, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: daily, time_start: 2004-10-01, time_end: 2026-11-09,
              legend_url: https://gibs.earthdata.nasa.gov/legends/OMI_Nitrogen_Dioxide_Tropo_Column_H.svg}
  location: null
  conversion: {native_units: molecules/cm², scale: 1.0e-15}

# ---------------------------------------------------------------- atmosphere: MERRA-2 aerosols -----------

- id: merra2_dust
  name: Dust near the ground
  short_definition: How much desert dust floats in the air near the surface, in micrograms per cubic meter. Wind lifts it from deserts and can carry it across oceans.
  why_it_matters: Dust storms damage health, crops and solar panels, and dust fertilizes oceans and the Amazon far from where it started.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:DUSMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_Dust_Surface_Mass_Concentration_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_Dust_Surface_Mass_Concentration_Monthly_H.svg}
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}

- id: merra2_bc
  name: Black carbon (soot) near the ground
  short_definition: Tiny black soot particles in the air near the surface, in micrograms per cubic meter, from burning diesel, coal, wood and crop waste.
  why_it_matters: Soot gets deep into the lungs and, because it is dark, it absorbs sunlight and warms the air and darkens snow and ice.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:BCSMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: null
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}

- id: merra2_oc
  name: Organic carbon particles near the ground
  short_definition: Particles made of carbon-rich compounds in the air near the surface, in micrograms per cubic meter, from wildfires, crop burning, wood stoves and plants.
  why_it_matters: They are a big part of smoke and smog, harm health, and show where fires and burning are increasing or decreasing.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:OCSMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: null
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}

- id: merra2_so2
  name: Sulfur dioxide (SO₂) near the ground
  short_definition: The amount of sulfur dioxide gas in the air near the surface, in micrograms per cubic meter. Almost all of it comes from burning coal and oil that contain sulfur, plus volcanoes.
  why_it_matters: SO₂ irritates lungs and makes acid rain, and it is the clearest fingerprint of coal burning, so it shows whether power plants were cleaned up.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:SO2SMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_SO2_Column_Mass_Density_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_SO2_Column_Mass_Density_Monthly_H.svg}
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}

- id: merra2_so4
  name: Sulfate particles near the ground
  short_definition: Tiny sulfate particles in the air near the surface, in micrograms per cubic meter. They form when sulfur dioxide from coal and oil reacts in the air.
  why_it_matters: Sulfate is a major part of the haze that shortens lives, and it reflects sunlight, so cleaning it up improves health but slightly unmasks global warming.
  units: µg/m³
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:SO4SMASS"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: null
  location: null
  conversion: {native_units: kg/m³, scale: 1.0e9}

- id: merra2_aod
  name: Total aerosol optical thickness
  short_definition: How much sunlight is blocked by all the tiny particles in the air (dust, smoke, soot, sulfate, sea salt) from the ground to space. 0 means perfectly clear; above 1 is very hazy.
  why_it_matters: It sums up the whole haze in one number, showing where the air is getting cleaner or dirtier and how much sunlight reaches the ground.
  units: unitless
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:TOTEXTTAU"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: {kind: gibs, layer: MERRA2_Total_Aerosol_Optical_Thickness_550nm_Extinction_Monthly, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 1980-01-01, time_end: 2026-08-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MERRA2_Total_Aerosol_Optical_Thickness_550nm_Extinction_Monthly_H.svg}
  location: null

- id: merra2_sulfate_aod
  name: Sulfate aerosol optical thickness
  short_definition: How much sunlight is blocked only by sulfate particles (made from sulfur dioxide) in the whole column of air. 0 is perfectly clear.
  why_it_matters: It isolates the part of the haze that comes mostly from coal and oil burning, and sulfate haze cools the climate by reflecting sunlight.
  units: unitless
  sphere: atmosphere
  source: MERRA-2 (model reanalysis with assimilated aerosols)
  mission_or_model: MERRA-2
  product: "M2TMNXAER.5.12.4:SUEXTTAU"
  dataset: MERRA-2 M2TMNXAER v5.12.4
  access: Giovanni
  temporal_resolution: monthly
  available_start: 1980-01-01
  available_end: 2025-12-31
  coverage: global
  map_layer: null
  location: null

# ---------------------------------------------------------------- land: MODIS LST (AppEEARS) -------------
# MOD11A2 (8-day composites, 1 km) through an AppEEARS area request: the provider reads AppEEARS'
# per-date area statistics, applies the 0.02 scale factor if needed (-> Kelvin) and averages to months.
# We show °C: value_K - 273.15. (MOD11C3, the 0.05° monthly product, is not offered by AppEEARS.)

- id: modis_lst_day
  name: Daytime land surface temperature
  short_definition: How hot the ground itself gets in the late morning, seen from space by its heat glow. Pavement, roofs and deserts can be much hotter than the air above them.
  why_it_matters: Hot surfaces drive heat waves and dry out soils, and they show urban heat islands where cities replace plants with concrete.
  units: °C
  sphere: land
  source: MODIS on NASA's Terra satellite (converted from Kelvin)
  mission_or_model: MODIS
  product: "MOD11A2.061:LST_Day_1km"
  dataset: MODIS MOD11A2 v061
  access: AppEEARS
  temporal_resolution: 8-day
  available_start: 2000-03-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: MODIS_Terra_L3_Land_Surface_Temp_Monthly_Day, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2000-03-01, time_end: 2026-10-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MODIS_Land_Surface_Temp_H.svg}
  location: null
  ratio_scale: false
  conversion: {native_units: K, offset: -273.15, note: "MOD11A2 LST is in Kelvin (after the 0.02 scale factor)"}

- id: modis_lst_night
  name: Nighttime land surface temperature
  short_definition: How warm the ground stays late at night, seen from space. Cities stay warm at night because concrete and asphalt release the heat they stored during the day.
  why_it_matters: Hot nights are when heat waves are most dangerous to health, and they are where the urban heat island effect is strongest.
  units: °C
  sphere: land
  source: MODIS on NASA's Terra satellite (converted from Kelvin)
  mission_or_model: MODIS
  product: "MOD11A2.061:LST_Night_1km"
  dataset: MODIS MOD11A2 v061
  access: AppEEARS
  temporal_resolution: 8-day
  available_start: 2000-03-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: MODIS_Terra_L3_Land_Surface_Temp_Monthly_Night, tile_matrix_set: GoogleMapsCompatible_Level6, format: png, max_zoom: 6,
              time_step: monthly, time_start: 2000-03-01, time_end: 2026-10-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MODIS_Land_Surface_Temp_H.svg}
  location: null
  ratio_scale: false
  conversion: {native_units: K, offset: -273.15, note: "MOD11A2 LST is in Kelvin (after the 0.02 scale factor)"}

# ---------------------------------------------------------------- land: MODIS NDVI (AppEEARS) -----------
# MOD13A3 monthly 1 km NDVI through an AppEEARS area request (area statistics; 0.0001 scale applied if needed).

- id: modis_ndvi
  name: Vegetation greenness (NDVI)
  short_definition: How green and leafy the land is, measured from space by how plants reflect red and near-infrared light. It goes from about 0 (bare soil, rock, sand) to near 1 (dense healthy forest).
  why_it_matters: It shows where forests are cut down, where farmland spreads or dries out, and where grazing and drought turn land into desert.
  units: unitless
  sphere: land
  source: MODIS on NASA's Terra satellite
  mission_or_model: MODIS
  product: "MOD13A3.061:_1_km_monthly_NDVI"
  dataset: MODIS MOD13A3 v061
  access: AppEEARS
  temporal_resolution: monthly
  available_start: 2000-02-01
  available_end: 2025-12-31
  coverage: land
  map_layer: {kind: gibs, layer: MODIS_Terra_L3_NDVI_Monthly, tile_matrix_set: GoogleMapsCompatible_Level7, format: png, max_zoom: 7,
              time_step: monthly, time_start: 2000-03-01, time_end: 2026-10-01,
              legend_url: https://gibs.earthdata.nasa.gov/legends/MODIS_L3_NDVI_H.svg}
  location: null

# ---------------------------------------------------------------- atmosphere: greenhouse gas records -----
# Ready-made single series (coverage "series"): no area to draw. Real access: the NOAA GML monthly text
# files named in `product` (app/providers/noaa_gml.py).
# available_end = latest month in the NOAA files when last checked (2026-11); bump when refreshing.

- id: mauna_loa_co2
  name: Carbon dioxide at Mauna Loa
  short_definition: The amount of carbon dioxide in the air measured on top of a Hawaiian volcano since 1958, in parts per million (ppm). It is far from cities, so it represents the whole planet.
  why_it_matters: This "Keeling curve" is the longest direct record of CO₂, the main gas warming the planet, and its rise comes from burning coal, oil and gas.
  units: ppm
  sphere: atmosphere
  source: NOAA Global Monitoring Laboratory & Scripps Institution of Oceanography
  mission_or_model: NOAA/Scripps
  product: "NOAA-GML:co2_mm_mlo"
  dataset: Mauna Loa CO₂ (NOAA/Scripps)
  access: NOAA GML
  temporal_resolution: monthly
  available_start: 1958-03-01
  available_end: 2026-09-30
  coverage: series
  map_layer: null
  location: {lat: 19.54, lon: -155.58, label: "Mauna Loa Observatory, Hawaii"}

- id: noaa_co2_marine
  name: Global carbon dioxide (marine air)
  short_definition: The average amount of carbon dioxide in clean air over the oceans, from a worldwide network of sampling sites, in parts per million (ppm).
  why_it_matters: It is a planet-wide check on the Mauna Loa record and shows that CO₂ is rising everywhere, not just in one place.
  units: ppm
  sphere: atmosphere
  source: NOAA Global Monitoring Laboratory (global marine surface network)
  mission_or_model: NOAA GML
  product: "NOAA-GML:co2_mm_gl"
  dataset: Global marine CO₂ (NOAA)
  access: NOAA GML
  temporal_resolution: monthly
  available_start: 1979-01-01
  available_end: 2026-07-31
  coverage: series
  map_layer: null
  location: null

- id: noaa_ch4_marine
  name: Global methane (marine air)
  short_definition: The average amount of methane in clean air over the oceans, in parts per billion (ppb). Methane is the main ingredient of natural gas.
  why_it_matters: Methane traps far more heat than CO₂ per molecule; it comes from gas and oil leaks, cattle, rice fields, landfills and wetlands.
  units: ppb
  sphere: atmosphere
  source: NOAA Global Monitoring Laboratory (global marine surface network)
  mission_or_model: NOAA GML
  product: "NOAA-GML:ch4_mm_gl"
  dataset: Global marine CH₄ (NOAA)
  access: NOAA GML
  temporal_resolution: monthly
  available_start: 1983-07-01
  available_end: 2026-06-30
  coverage: series
  map_layer: null
  location: null

