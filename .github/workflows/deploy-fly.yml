# Optional Fly.io deploy (alternative to Render). Runs only after CI succeeded on a push to main,
# and only when the repository variable FLY_DEPLOY is "true" (Settings -> Secrets and variables ->
# Actions -> Variables). Needs the secret FLY_API_TOKEN. Render users can ignore/delete this file.
name: Deploy (Fly.io)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.FLY_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # deploy exactly the commit CI tested
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
