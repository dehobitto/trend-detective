# Fly.io alternative to render.yaml (see docs/DEPLOY.md). Change `app` to the name you create.
app = "trend-detective"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  TD_DATA_PROVIDER = "live"
  # Earthdata login as secrets: fly secrets set TD_EARTHDATA_USERNAME=... TD_EARTHDATA_PASSWORD=... TD_EARTHDATA_TOKEN=...
  TD_CHAT_BACKEND = "fieldguide"
  TD_CHAT_PROVIDER = "openai"
  # Field guide LLM key as a secret: fly secrets set OPENAI_API_KEY=...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Jobs live in memory: keep ONE machine (fly scale count 1), never several.

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
