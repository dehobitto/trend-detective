# Render Blueprint: one Docker web service (API at /api + frontend at /). See docs/DEPLOY.md.
# Dashboard -> New -> Blueprint -> pick this repo. Deploys only after GitHub CI checks pass on main.
services:
  - type: web
    name: trend-detective
    runtime: docker
    plan: free                 # 512 MB RAM; see docs/DEPLOY.md "Memory" before demo day
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # wait for the GitHub Actions CI checks on the commit
    envVars:
      - key: TD_DATA_PROVIDER
        value: live
      # Real NASA data needs an Earthdata login (secrets: set in the dashboard, never in git).
      # Username + password + token together is the verified setup (GES DISC, LP DAAC MODIS, LAADS night lights).
      - key: TD_EARTHDATA_USERNAME
        sync: false
      - key: TD_EARTHDATA_PASSWORD
        sync: false
      - key: TD_EARTHDATA_TOKEN
        sync: false
      # Field guide chat (LLM). The key is a secret: set it in the dashboard.
      - key: TD_CHAT_BACKEND
        value: fieldguide
      - key: TD_CHAT_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
